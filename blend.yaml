apiVersion: blends.acryl.dev/v1alpha1
kind: Blueprint
metadata:
  id: acrylblends.maintenance-log
  name: "Maintenance Log"
  version: 0.1.0
  category: industrial
  description: "An industrial maintenance control room: equipment register, preventive work orders, downtime and close-out notes. It records machine states; it never controls machinery."
  license: MIT
  visibility: public
spec:
  runtime: cordis
  parameters:
    hostname: { type: string, default: 127.0.0.1 }
  rows:
    - id: router
      name: acryl-router
    - id: home
      name: home
    # The domain: machines, work orders and service history, saved as JSON in the app's data home.
    - id: plant
      name: plant
    # The PLANT/OPS top bar with the site and online count.
    - id: plant-shell
      name: plant-shell
    # The control room: register, upcoming work, asset inspector, work-order detail and actions.
    - id: maintenance
      name: maintenance
    - id: extensions
      name: extensions
    - id: server
      name: acryl-node-server
      config:
        hostname: "{{parameters.hostname}}"
    - id: acryl-door
      name: acryl-door
